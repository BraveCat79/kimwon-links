<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="생활·육아·자동차·AI 도구·IT를 직접 알아보고 정리하는 블로그 5개와 SNS 채널 모음">

<meta property="og:url" content="https://links.kimwon.com/">
<meta property="og:site_name" content="Kimwon Links">
<meta name="twitter:card" content="summary">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mute:#666;--line:#e5e5e5;--card:#fafafa;--acc:#1d5fbf;--btn:#1a1a1a;--btnfg:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#ececec;--mute:#9a9a9a;--line:#2a2a2a;--card:#1b1b1b;--acc:#7fb0ff;--btn:#ececec;--btnfg:#121212}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
main{max-width:640px;margin:0 auto;padding:28px 18px 56px}
header h1{font-size:26px;margin:0 0 6px;line-height:1.25}
header p{margin:0;color:var(--mute)}
.crumb{font-size:13px;color:var(--mute);margin-bottom:14px}
.btns{display:grid;grid-template-columns:1fr;gap:10px;margin:22px 0}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:12px 16px;border-radius:12px;background:var(--btn);color:var(--btnfg);font-weight:600;text-align:center}
.btn:hover{text-decoration:none;opacity:.9}
.btn.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
h2{font-size:17px;margin:30px 0 10px;padding-top:6px}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.cards{grid-template-columns:1fr 1fr}}
.card{display:block;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg)}
.card:hover{text-decoration:none;border-color:var(--acc)}
.card b{display:block;font-size:17px;margin-bottom:4px}
.card span{color:var(--mute);font-size:14px}
.card small{display:block;margin-top:8px;color:var(--acc);font-size:13px}
ul.list{list-style:none;padding:0;margin:0}
ul.list li{padding:12px 0;border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:0}
ul.list a{display:block;color:var(--fg);font-weight:600;line-height:1.4}
ul.list a:hover{color:var(--acc)}
ul.list p{margin:4px 0 0;color:var(--mute);font-size:14px}
ul.list time,ul.list em{font-size:12px;color:var(--mute);font-style:normal;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);font-size:14px}
.chip:hover{text-decoration:none;border-color:var(--acc)}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
footer a{color:var(--mute)}
.empty{color:var(--mute);font-size:14px}
</style>
</head>
<body><main>
<header><h1>없는 페이지</h1><p><a href="https://links.kimwon.com/">홈으로</a></p></header>
<footer>Kimwon Links · <a href="https://links.kimwon.com/">홈</a> · 갱신 2026-09-22 · <a href="https://links.kimwon.com/sitemap.xml">sitemap</a></footer>
</main></body></html>
